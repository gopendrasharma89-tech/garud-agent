name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (strict TS type check)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Verify CLI
        run: |
          node dist/cli/main.js version
          node dist/cli/main.js tools | head -20
          node dist/cli/main.js doctor || true

  audit-quality:
    name: Repository quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE
          test -d docs
          test -d examples
          echo "All required repository artifacts present."
